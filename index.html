<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKJ Simulator</title>

    <!-- Font "Press Start 2P" di-SELF-HOST (file-nya ada di public/fonts/, ikut
         ter-deploy bareng project ini), BUKAN diambil dari fonts.googleapis.com
         lewat internet seperti sebelumnya. Ini sengaja diganti karena banyak
         browser (Brave, Firefox mode privasi ketat) dan extension ad-blocker yang
         MEMBLOKIR domain fonts.googleapis.com/fonts.gstatic.com secara default,
         sehingga font gagal dimuat dan Phaser jatuh ke font fallback -- gejalanya
         persis seperti "font berubah pas di-deploy" walau di localhost normal
         (karena localhost sering sudah ada cache lama dari percobaan sebelumnya).
         Dengan self-host, font selalu berhasil dimuat karena satu domain sama
         dengan web-nya sendiri, tidak butuh request ke server pihak ketiga. -->
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/press-start-2p-latin-400-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/press-start-2p-latin-ext-400-normal.woff2') format('woff2');
        unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Press Start 2P', monospace;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
